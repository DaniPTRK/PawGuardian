# pogstgres associated PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: pawguardian
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
# postgres deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pawguardian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:13.2-alpine
          env:
            - name: POSTGRES_USER
              value: pawguardian
            - name: POSTGRES_DB
              value: pawguardian
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pawguardian-secrets
                  key: db-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pawguardian", "-d", "pawguardian"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pawguardian
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
