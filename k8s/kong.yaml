apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: pawguardian
data:
  kong.yml: |
    _format_version: "3.0"

    services:
      - name: auth-service
        url: http://backend:8090
        routes:
          - name: auth-route
            paths:
              - /api/v1/auth

      - name: api-service
        url: http://backend:8090
        routes:
          - name: api-route
            paths:
              - /api/v1

      - name: telemetry-service
        url: http://telemetry-simulator:8091
        routes:
          - name: telemetry-route
            paths:
              - /simulator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: pawguardian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kong
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: kong
          image: kong:3.6
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
          ports:
            - containerPort: 8000
            - containerPort: 8001
          volumeMounts:
            - mountPath: /etc/kong/kong.yml
              name: kong-config
              subPath: kong.yml
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: pawguardian
spec:
  selector:
    app: kong
  type: NodePort
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: 30800
    - name: admin
      port: 8001
      targetPort: 8001
      nodePort: 30801

