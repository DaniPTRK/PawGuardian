spring:
  application:
    name: project
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pawguardian}
    username: ${DB_USERNAME:pawguardian}
    password: ${DB_PASSWORD:pawguardian}
  jpa:
    properties:
      hibernate:
        default_schema: project
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true
        ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    table: project_schema_version
    baseline-version: 0
    connect-retries: 10  # Retry 10 times
    connect-retries-interval: 10  # Wait 10 seconds between retries
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pawguardian}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

vars:
  security:
    enable: true

server:
  port: 8090

token:
  ttl: 3600000
  secret: "4mLu4777r4nd4firiSi7inL0cD34min7iriD3spr37in3SiIiPunP3P3rn474SiM4Min73Inim4P0473Vin3PrinLum3R474c3scCuS73l3l3V0rb3scUnd33s7i04r3SiNim3niNuV4S7iC3Mul7N0iN34mIubi7"

admin:
  username: admin
  email: admin@admin.com
  password: admin


geofencing:
  alert-cooldown-minutes: ${GEOFENCE_COOLDOWN:5}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

