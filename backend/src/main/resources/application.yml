spring:
  application:
    name: project
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pawguardian}
    username: ${DB_USERNAME:pawguardian}
    password: ${DB_PASSWORD:pawguardian}
  jpa:
    properties:
      hibernate:
        default_schema: project
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true
        ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    table: project_schema_version
    baseline-version: 0
    connect-retries: 10  # Retry 10 times
    connect-retries-interval: 10  # Wait 10 seconds between retries
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

vars:
  security:
    enable: true

