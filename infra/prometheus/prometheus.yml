global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8090']
        labels:
          application: 'pawguardian-backend'
          env: 'production'

  - job_name: 'prometheus-self'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          application: 'prometheus'
